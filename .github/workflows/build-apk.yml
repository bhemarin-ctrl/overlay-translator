name: Build Tradutor Manga

on:
  workflow_dispatch:
  push:
    branches: [main, manga-dev]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Stub local.properties
        run: |
          [ -f local.properties ] || echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Assemble debug
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Kotlin errors::$msg"
          fi
          exit $code
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tradutor-manga.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tradutor-manga
          path: tradutor-manga.apk
          retention-days: 30
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tradutor-manga.apk \
            --title "Tradutor Manga - APK mais recente" \
            --notes "Build automático do commit ${GITHUB_SHA::7} ($(date -u +%d/%m/%Y\ %H:%M) UTC)" \
            --target "$GITHUB_SHA"
